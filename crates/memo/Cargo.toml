[package]
name = "memopaws-memo"
version = "0.1.0"
edition = "2021"

[dependencies]
memopaws-core = { path = "../core" }
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = "5"
pinyin = "0.10"
strsim = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
