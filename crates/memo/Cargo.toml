[package]
name = "memopaws-memo"
version = "0.0.3"
edition = "2021"

[dependencies]
memopaws-core = { path = "../core" }
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = "5"
pinyin = "0.10"
strsim = "0.11"

# Pinned to match `memopaws-tauri`: 0.60 turned the Win32 handle types into
# non-nullable newtypes, which the keyboard hook there depends on. Only
# `MoveFileExW` and its flags are used here, and those are identical in 0.59.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
