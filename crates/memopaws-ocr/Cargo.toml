[package]
name = "memopaws-ocr"
version = "0.1.0"
edition = "2021"

[dependencies]
memopaws-core = { path = "../memopaws-core" }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
thiserror = "2"
base64 = "0.22"
zeroize = "1"

[dev-dependencies]
wiremock = "0.6"
