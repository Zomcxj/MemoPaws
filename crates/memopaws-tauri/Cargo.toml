[package]
name = "memopaws-tauri"
version = "0.1.0"
edition = "2021"

[package.metadata.tauri]
bundle = { active = false }

[package.metadata.tauri.winres]
file-version = "0.1.0.0"
product-version = "0.1.0.0"

[lib]
name = "memopaws_tauri"
path = "src/lib.rs"

[[bin]]
name = "memopaws"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memopaws-core = { path = "../memopaws-core" }
memopaws-config = { path = "../memopaws-config" }
memopaws-memo = { path = "../memopaws-memo" }
memopaws-keys = { path = "../memopaws-keys" }
memopaws-ocr = { path = "../memopaws-ocr" }
memopaws-clipboard = { path = "../memopaws-clipboard" }
memopaws-canvas = { path = "../memopaws-canvas" }
arboard = "3"
zeroize = "1"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
