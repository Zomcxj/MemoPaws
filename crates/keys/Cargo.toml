[package]
name = "memopaws-keys"
version = "0.0.3"
edition = "2021"

[dependencies]
memopaws-core = { path = "../core" }
aes-gcm = { version = "0.10", features = ["aes"] }
rand = "0.8"
zeroize = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
scrypt = "0.11"
tempfile = "3"

[dev-dependencies]
hex = "0.4"
